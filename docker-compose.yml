services:
  web:
    build: .
    container_name: django_app
    command: >
      bash -c "
        python manage.py makemigrations &&
        python manage.py migrate && 
        python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    depends_on:
      - redis

  celery:
    build: .
    container_name: celery_worker
    command: celery -A instagenda worker --loglevel=debug
    volumes:
      - .:/code
    depends_on:
      - redis

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"

  db:
    image: postgres:latest
    container_name: db
    restart: always
    environment:
      POSTGRES_DB: instagenda
      POSTGRES_USER: instagenda
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
