services:
  db:
    image: postgres:latest
    container_name: instagenda-db
    restart: always
    environment:
      POSTGRES_DB: instagenda
      POSTGRES_USER: instagenda
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
